# check — this repository under its own rules: the written invariants as
# greps, the classifier corpora, the negative-control suite, and a pinned
# gitleaks over the change range (the house pattern of the devpowers line).
name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'          # weekly full-history secret audit

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: repository invariants
        run: bash scripts/lint.sh
      - name: classifier corpora
        run: bash plugins/prediction-protocol/tests/classify-corpus.sh
      - name: negative controls
        run: bash plugins/prediction-protocol/tests/run.sh
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          RANGE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "$BASE_REF"
            RANGE="origin/${BASE_REF}..HEAD"
          elif [ "$EVENT_NAME" = "push" ]; then
            if ! printf '%s' "$BEFORE_SHA" | grep -qE '^0+$'; then
              RANGE="${BEFORE_SHA}..${HEAD_SHA}"
            fi
          fi
          # an unresolvable range exits 0 inside gitleaks — validate it with git first
          PROBE=("--all"); [ -n "$RANGE" ] && PROBE=("$RANGE")
          if ! git log --text --diff-merges=first-parent --max-count=1 --format=%H "${PROBE[@]}" >/dev/null; then
            echo "secret-scan: git cannot run 'log --text --diff-merges=first-parent ${RANGE:-(full history)}' — failing closed" >&2
            exit 2
          fi
          docker run --rm -v "$PWD:/repo:ro" -w /repo "$GITLEAKS_IMAGE" \
            detect --source /repo --redact --no-banner -v \
            --log-opts="--text --diff-merges=first-parent${RANGE:+ $RANGE}"
