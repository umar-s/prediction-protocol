name: check
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: bash scripts/lint.sh
      - name: classifier corpora
        run: bash plugins/prediction-protocol/tests/classify-corpus.sh
      - name: negative controls
        run: bash plugins/prediction-protocol/tests/run.sh
      - name: plugin manifest
        run: python3 -c "import json; json.load(open('plugins/prediction-protocol/.claude-plugin/plugin.json')); json.load(open('plugins/prediction-protocol/hooks/hooks.json')); print('manifests parse')"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
